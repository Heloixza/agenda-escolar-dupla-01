
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Escolar</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>

    <div class="container">

        <div class="header">
            Agenda Escolar
        </div>

        <div class="conteudo">

            <h3 class="titulo">Entrar</h3>

            <div className="campos">
                <input
                    type="email"
                    placeholder="E-mail"
                    className="campo"
                />

                <input
                    type="password"
                    placeholder="Senha"
                    className="campo"
                />
            </div>

            <button class="botao">Entrar</button>

            <a href="#" class="criar-conta">
                Criar uma conta
            </a>

        </div>

    </div>

</body>
</html>
